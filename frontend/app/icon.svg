  <!-- Background rounded plate -->
  <rect width="32" height="32" rx="7" fill="#0b1329" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="url(#acme-grad)" stroke-opacity="0.3" />

