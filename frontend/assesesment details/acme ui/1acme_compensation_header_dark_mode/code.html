<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ACME Compensation - Global Header &amp; Control Bar</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#45464d",
                        "surface-container": "#1e293b",
                        "on-primary-fixed": "#131b2e",
                        "surface-bright": "#334155",
                        "on-error": "#690005",
                        "surface-container-high": "#1c2b3c",
                        "surface-container-lowest": "#010f1f",
                        "surface": "#0f172a",
                        "secondary-fixed-dim": "#adc6ff",
                        "on-surface": "#d4e4fa",
                        "background": "#051424",
                        "outline": "#334155",
                        "error-container": "#93000a",
                        "inverse-surface": "#d4e4fa",
                        "on-secondary-container": "#e6ecff",
                        "inverse-primary": "#565e74",
                        "on-primary": "#283044",
                        "surface-variant": "#273647",
                        "primary": "#bec6e0",
                        "on-secondary-fixed-variant": "#004395",
                        "on-tertiary-fixed": "#002113",
                        "on-tertiary-container": "#009365",
                        "surface-container-highest": "#273647",
                        "tertiary-fixed": "#6ffbbe",
                        "surface-tint": "#bec6e0",
                        "tertiary": "#4edea3",
                        "primary-fixed": "#dae2fd",
                        "inverse-on-surface": "#233143",
                        "primary-fixed-dim": "#bec6e0",
                        "error": "#ffb4ab",
                        "tertiary-fixed-dim": "#4edea3",
                        "on-background": "#d4e4fa",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-surface-variant": "#94a3b8",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-tertiary": "#003824",
                        "surface-dim": "#051424",
                        "on-secondary-fixed": "#001a42",
                        "surface-container-low": "#0d1c2d",
                        "on-error-container": "#ffdad6",
                        "secondary": "#adc6ff",
                        "on-secondary": "#002e6a",
                        "primary-container": "#0f172a",
                        "secondary-fixed": "#d8e2ff",
                        "secondary-container": "#0566d9",
                        "tertiary-container": "#001c10",
                        "on-primary-container": "#798098"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "md": "16px",
                        "margin": "24px",
                        "xs": "4px",
                        "gutter": "16px",
                        "sm": "8px",
                        "container-max": "1440px",
                        "base": "4px",
                        "lg": "24px",
                        "xl": "40px"
                    },
                    "fontFamily": {
                        "display": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "display": ["36px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #051424; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-background min-h-screen font-body-md text-on-surface">
<!-- Global Header & Control Bar -->
<header class="bg-surface border-b border-outline w-full h-xl flex items-center px-margin sticky top-0 z-50">
<div class="flex justify-between items-center w-full max-w-container-max mx-auto">
<!-- Left: Branding & Status -->
<div class="flex items-center gap-gutter">
<h1 class="font-headline-md text-headline-md text-on-surface m-0 tracking-tight">ACME Compensation</h1>
<div class="flex items-center gap-sm bg-tertiary-fixed-dim/20 text-tertiary px-2 py-1 rounded-full border border-tertiary/20">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Global Payroll Sync • Active</span>
</div>
</div>
<!-- Right: Controls & Actions -->
<div class="flex items-center gap-gutter">
<!-- Base Currency Segmented Control / Dropdown Minimalist approach -->
<div class="flex items-center gap-sm mr-sm">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Base Currency</span>
<div class="relative">
<select class="appearance-none bg-surface-container border border-outline rounded-DEFAULT text-on-surface font-body-sm text-body-sm pl-sm pr-lg py-[6px] focus:outline-none focus:ring-1 focus:ring-secondary focus:border-secondary transition-shadow cursor-pointer hover:bg-surface-container-high h-[32px]">
<option value="USD">USD ($)</option>
<option value="EUR">EUR (€)</option>
<option value="GBP">GBP (£)</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-size: 16px;">arrow_drop_down</span>
</div>
</div>
<!-- Secondary Action: Import CSV -->
<button class="h-[32px] inline-flex items-center gap-sm bg-surface-container border border-outline rounded-DEFAULT px-md font-label-md text-label-md text-on-surface hover:bg-surface-container-high transition-colors focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 focus:ring-offset-surface" type="button">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="upload_file" style="font-size: 18px;">upload_file</span>
                    Import CSV
                </button>
<!-- Primary Action: Add Employee -->
<button class="h-[32px] inline-flex items-center gap-sm bg-primary border border-transparent rounded-DEFAULT px-md font-label-md text-label-md text-on-primary hover:bg-primary/90 transition-colors focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 focus:ring-offset-surface shadow-sm" type="button">
<span class="material-symbols-outlined" data-icon="add" style="font-size: 18px;">add</span>
                    Add Employee
                </button>
</div>
</div>
</header>
<!-- Main Content Canvas (Empty for context) -->
<main class="w-full max-w-container-max mx-auto px-margin py-lg">
<!-- Content would go here -->
<div class="h-64 border border-dashed border-outline rounded-lg flex items-center justify-center text-on-surface-variant font-body-md">
            Main Application Canvas
        </div>
</main>
</body></html>
